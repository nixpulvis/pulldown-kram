[package]
name = "pulldown-kram"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Read Markdown written for kramdown, Jekyll's default, as pulldown-cmark events with attributes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpulvis/pulldown-kram"
documentation = "https://docs.rs/pulldown-kram"
readme = "README.md"
keywords = ["markdown", "kramdown", "jekyll", "pulldown-cmark"]
categories = ["text-processing", "parser-implementations"]
# kramdown's test cases are 2 MB, and only for this repository's tests.
exclude = ["tests/kramdown_suite/"]

[dependencies]
bitflags = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
libtest-mimic = "0.8"

# Its own harness, to make each of kramdown's cases a test.
[[test]]
name = "kramdown_suite"
harness = false
